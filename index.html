<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Swiss glaciers and urban water use</title>
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <main>
      <h1>Swiss glaciers and urban water use</h1>
      <p id="status" role="status">Loading source data…</p>
      <p><a href="./overview.html">Open the glacier data overview</a></p>
      <div id="story" class="story" hidden>
        <div class="story-stage">
          <header class="chapter-header">
            <nav class="chapter-nav" aria-label="Story chapters">
              <a href="#individual">01 Individual</a>
              <a href="#apartment">02 Apartment</a>
              <a href="#city">03 City</a>
              <a href="#comparison">04 Comparison</a>
            </nav>
            <h2 id="chapter-title" tabindex="-1"></h2>
          </header>
          <div class="story-composition">
            <div id="chapter-context" class="chapter-context">
              <div id="individual-context">
                <span class="person-glyph hero-person" aria-hidden="true"></span>
                <p>One Zürich resident</p>
              </div>
              <div id="apartment-context" hidden>
                <div class="apartment-figures">
                  <div id="resident-icons" class="resident-icons" aria-hidden="true"></div>
                  <div id="building-floors" class="building-floors" aria-hidden="true"></div>
                </div>
                <p id="building-caption"></p>
              </div>
              <div id="city-context" hidden>
                <div id="city-map" class="city-map"></div>
                <p id="city-population"></p>
              </div>
            </div>
            <div id="cube-stage"></div>
          </div>
          <p id="cube-render-status" role="status"></p>
          <div id="comparison-labels" hidden>
            <div class="comparison-city-headings">
              <span id="individual-consumption-label" hidden>One Zürich resident · consumption</span>
              <button type="button" id="comparison-city-heading" title="Scroll sideways or click to change city">
                <span id="comparison-city-label"></span> <span aria-hidden="true">↔</span>
              </button>
              <button type="button" id="comparison-period-heading" title="Scroll sideways or click to change consumption period">
                <span id="comparison-period-label"></span> <span aria-hidden="true">↔</span>
              </button>
            </div>
            <button type="button" id="comparison-glacier-heading" hidden title="Scroll sideways or click to change glacier">
              <span id="comparison-glacier-label"></span> <span aria-hidden="true">↔</span>
            </button>
          </div>
          <div id="story-controls">
            <div id="subject-controls" class="story-control" hidden>
              <button type="button" data-step="-1">‹</button>
              <label for="story-subject" id="subject-label"></label>
              <select id="story-subject"></select>
              <button type="button" data-step="1">›</button>
            </div>
            <div id="period-controls" class="story-control">
              <button type="button" data-step="-1" aria-label="Previous period">‹</button>
              <label for="story-period">Period</label>
              <select id="story-period">
                <option value="1">Day</option>
                <option value="30" selected>30-day month</option>
                <option value="365">365-day year</option>
              </select>
              <button type="button" data-step="1" aria-label="Next period">›</button>
            </div>
            <div id="glacier-controls" class="story-control" hidden>
              <button type="button" data-step="-1" aria-label="Previous glacier">‹</button>
              <label for="story-glacier">Glacier</label><select id="story-glacier"></select>
              <button type="button" data-step="1" aria-label="Next glacier">›</button>
            </div>
          </div>
          <div id="comparison-values" hidden role="status"></div>
          <div class="story-values" role="status">
            <p id="cube-values"></p>
            <p id="cube-unit"></p>
            <p id="cube-scale-note"></p>
          </div>
        </div>
        <div class="story-track" aria-hidden="true">
          <div class="story-step" id="individual"></div>
          <div class="story-step" id="apartment"></div>
          <div class="story-step" id="city"></div>
          <div class="story-step" id="comparison"></div>
        </div>
      </div>
    </main>
  </body>
</html>
